name: CI
on:
  push:
    branches: [main, "engineering/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile recon_engine.py recon_pipeline.py tests/test_recon_engine.py
      - name: Validate shell syntax
        run: bash -n recon_pipeline.sh installer_script.sh
      - name: Run local installer checks
        run: ./installer_script.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        run: |
          python recon_engine.py --version
          python recon_engine.py --help
          python recon_pipeline.py --version
